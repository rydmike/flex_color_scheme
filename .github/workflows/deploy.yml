# This GitHub action runs on a release, when the GitHub repo is "published"
# This workflow:
#  - Installs dart and flutter
#  - Uses flutter stable channel.
#    Consider setting up a matrix later with beta and dev included too.
#  - Enables flutter web
#  - Gets package dependencies
#  - Runs dart analyze.
#  - Show outdated packages, just added for info.
#  - Verify that dart format is used by all committed code, fails if not.
#    Controversial but pub.dev penalizes you if dart format is not used.
#  - Run all tests with coverage.
#  - Upload code coverage output to Codecov for analysis.
#  - Build 5 different WEB example apps using FlexColorScheme.
#    All examples use these steps:
#    - Flutter clean.
#    - Flutter build web app, in release mode, to a versioned GitHub Pages path.
#    - Deploy each built Web App to GitHub pages.
#  - Additionally build Themes Playground with WASM GC and deploy to Netlify.
# GitHub Pages destination slug comes from .github/web-deploy.env (WEB_VERSION).
name: Deploy
on:
  push:
    branches: [none]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [none]
    paths-ignore:
      - "**.md"
  release:
    branches: [master]
    types: [published]

jobs:
  flutter_tests:
    name: "Analyze and test package, then build and deploy 5 web apps"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load web deploy version
        run: |
          set -a
          # shellcheck source=/dev/null
          source .github/web-deploy.env
          set +a
          echo "WEB_VERSION=$WEB_VERSION" >> "$GITHUB_ENV"
      - name: Install Flutter and Dart SDK
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: "Show Dart SDK version"
        run: dart --version
      - name: "Show Flutter SDK version"
        run: flutter --version
      - name: "Flutter Enable Web"
        run: flutter config --enable-web
      - name: "Install Flutter package dependencies"
        run: flutter pub get
      - name: "Analyze Dart source"
        run: dart analyze
      - name: "Show outdated packages"
        run: flutter pub outdated
      - name: "Verify that Dart formatting is used, fail if not"
        run: dart format --output=none --set-exit-if-changed .
      - name: "Test package FlexColorScheme with coverage"
        run: flutter test --coverage
      - name: "Upload test coverage to Codecov"
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
          override_branch: master

      # Example 1 Basic theme - Build and deploy
      - name: "EXAMPLE-1 START BUILD - Flutter clean before build"
        run: flutter clean && cd example && flutter clean
      - name: "EXAMPLE-1 WEB release build"
        run: cd example && flutter build web --base-href "/flexcolorscheme/basictheme-${{ env.WEB_VERSION }}/" --release -t lib/example1_basic_theme_usage/main.dart
      - name: "EXAMPLE-1 DEPLOY to GitHub Pages repository, published on commit."
        uses: dmnemec/copy_file_to_another_repo_action@v1.0.4
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source_file: 'example/build/web/.'
          destination_folder: 'flexcolorscheme/basictheme-${{ env.WEB_VERSION }}'
          destination_repo: 'rydmike/rydmike.github.io'
          user_email: 'm.rydstrom@gmail.com'
          user_name: 'rydmike'

      # Example 2 Custom theme - Build and deploy
      - name: "EXAMPLE-2 START BUILD - Flutter clean before build"
        run: flutter clean && cd example && flutter clean
      - name: "EXAMPLE-2 WEB release build"
        run: cd example && flutter build web --base-href "/flexcolorscheme/customtheme-${{ env.WEB_VERSION }}/" --release -t lib/example2_custom_theme/main.dart
      - name: "EXAMPLE-2 DEPLOY to GitHub Pages repository, published on commit."
        uses: dmnemec/copy_file_to_another_repo_action@v1.0.4
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source_file: 'example/build/web/.'
          destination_folder: 'flexcolorscheme/customtheme-${{ env.WEB_VERSION }}'
          destination_repo: 'rydmike/rydmike.github.io'
          user_email: 'm.rydstrom@gmail.com'
          user_name: 'rydmike'

      # Example 3 Four themes - Build and deploy
      - name: "EXAMPLE-3 START BUILD - Flutter clean before build"
        run: flutter clean && cd example && flutter clean
      - name: "EXAMPLE-3 WEB release build"
        run: cd example && flutter build web --base-href "/flexcolorscheme/fourthemes-${{ env.WEB_VERSION }}/" --release -t lib/example3_four_themes/main.dart
      - name: "EXAMPLE-3 DEPLOY to GitHub Pages repository, published on commit."
        uses: dmnemec/copy_file_to_another_repo_action@v1.0.4
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source_file: 'example/build/web/.'
          destination_folder: 'flexcolorscheme/fourthemes-${{ env.WEB_VERSION }}'
          destination_repo: 'rydmike/rydmike.github.io'
          user_email: 'm.rydstrom@gmail.com'
          user_name: 'rydmike'

      # Example 4 All themes - Build and deploy
      - name: "EXAMPLE-4 START BUILD - Flutter clean before build"
        run: flutter clean && cd example && flutter clean
      - name: "EXAMPLE-4 WEB release build"
        run: cd example && flutter build web --base-href "/flexcolorscheme/allthemes-${{ env.WEB_VERSION }}/" --release -t lib/example4_all_themes/main.dart
      - name: "EXAMPLE-4 DEPLOY to GitHub Pages repository, published on commit."
        uses: dmnemec/copy_file_to_another_repo_action@v1.0.4
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source_file: 'example/build/web/.'
          destination_folder: 'flexcolorscheme/allthemes-${{ env.WEB_VERSION }}'
          destination_repo: 'rydmike/rydmike.github.io'
          user_email: 'm.rydstrom@gmail.com'
          user_name: 'rydmike'

      # Example 5 Themes playground - Build and deploy JS to GitHub Pages
      - name: "EXAMPLE-5 START BUILD - Flutter clean before build"
        run: flutter clean && cd example && flutter clean
      - name: "EXAMPLE-5 WEB release build"
        run: cd example && flutter build web --base-href "/flexcolorscheme/themesplayground-${{ env.WEB_VERSION }}/" --release -t lib/example5_themes_playground/main.dart
      - name: "EXAMPLE-5 DEPLOY to GitHub Pages repository, published on commit."
        uses: dmnemec/copy_file_to_another_repo_action@v1.0.4
        env:
          API_TOKEN_GITHUB: ${{ secrets.API_TOKEN_GITHUB }}
        with:
          source_file: 'example/build/web/.'
          destination_folder: 'flexcolorscheme/themesplayground-${{ env.WEB_VERSION }}'
          destination_repo: 'rydmike/rydmike.github.io'
          user_email: 'm.rydstrom@gmail.com'
          user_name: 'rydmike'

      # Themes Playground WASM-GC - Build and deploy to Netlify
      - name: "Themes playground WASM START BUILD - Flutter clean before build"
        run: flutter clean && cd example && flutter clean
      - name: "Themes playground WEB WASM-GC release build"
        run: cd example && flutter build web --wasm --release -t lib/example5_themes_playground/main.dart
      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './example/build/web'
          production-branch: master
          production-deploy: true
          netlify-config-path: './example/netlify.toml'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy to Netlify from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        timeout-minutes: 10
